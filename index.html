<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gộp File LaTeX Tự Động</title>
  <!-- Thư viện tạo file ZIP để tải về hàng loạt -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 720px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 24px;
    }

    .dropzone {
      border: 2px dashed #cbd5e1;
      border-radius: 8px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      background: #f1f5f9;
      transition: all 0.2s ease;
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone input {
      display: none;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: var(--primary);
      color: white;
      text-decoration: none;
      transition: background 0.2s ease;
    }

    .btn-action:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: #059669;
    }

    .btn-secondary:hover {
      background: #047857;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      margin-bottom: 16px;
    }

    .file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .file-info {
      font-size: 14px;
    }

    .file-name {
      font-weight: 600;
    }

    .file-meta {
      font-size: 12px;
      color: #64748b;
      margin-top: 2px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Gộp File LaTeX Tự Động</h1>
  <p class="subtitle">Tải lên các file định dạng như <code>[2H3Y2-1].tex</code> để tự động gộp thành <code>2H3Y2.tex</code>.</p>

  <label class="dropzone" id="dropzone">
    <input type="file" id="fileInput" multiple accept=".tex,.txt" />
    <strong>Nhấn để chọn file</strong> hoặc kéo thả danh sách file vào đây
  </label>

  <div id="resultArea" style="display: none;">
    <div class="results-header">
      <strong>Kết quả gộp (<span id="groupCount">0</span> file)</strong>
      <button class="btn-action btn-secondary" id="downloadAllBtn">Tải tất cả (.ZIP)</button>
    </div>
    <ul class="file-list" id="fileList"></ul>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const resultArea = document.getElementById('resultArea');
  const fileList = document.getElementById('fileList');
  const groupCount = document.getElementById('groupCount');
  const downloadAllBtn = document.getElementById('downloadAllBtn');

  let mergedOutputs = {};

  ['dragenter', 'dragover'].forEach(name => {
    dropzone.addEventListener(name, (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });
  });

  ['dragleave', 'drop'].forEach(name => {
    dropzone.addEventListener(name, (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
    });
  });

  dropzone.addEventListener('drop', (e) => {
    if (e.dataTransfer.files.length) {
      handleFiles(Array.from(e.dataTransfer.files));
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length) {
      handleFiles(Array.from(e.target.files));
    }
  });

  async function handleFiles(files) {
    mergedOutputs = {};
    const groups = {};

    // Phân loại file theo cấu trúc: [Prefix-SốThứTự] hoặc Prefix-SốThứTự
    files.forEach(file => {
      const match = file.name.match(/^\[?([A-Za-z0-9_]+)-(\d+)\]?\.tex$/i);
      
      let baseKey = '';
      let index = 0;

      if (match) {
        baseKey = match[1];
        index = parseInt(match[2], 10);
      } else {
        // Dự phòng nếu tên không có số thứ tự dạng -1, -2
        baseKey = file.name.replace(/\.tex$/i, '').replace(/[\[\]]/g, '');
      }

      if (!groups[baseKey]) groups[baseKey] = [];
      groups[baseKey].push({ file, index });
    });

    // Đọc và ghép nội dung
    for (const [key, items] of Object.entries(groups)) {
      items.sort((a, b) => a.index - b.index);

      const contents = await Promise.all(items.map(item => item.file.text()));
      mergedOutputs[`${key}.tex`] = contents.join('\n\n');
    }

    renderResults();
  }

  function renderResults() {
    fileList.innerHTML = '';
    const keys = Object.keys(mergedOutputs);

    if (keys.length === 0) {
      resultArea.style.display = 'none';
      return;
    }

    groupCount.textContent = keys.length;

    keys.forEach(fileName => {
      const li = document.createElement('li');
      li.className = 'file-item';

      const blob = new Blob([mergedOutputs[fileName]], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);

      li.innerHTML = `
        <div class="file-info">
          <div class="file-name">${fileName}</div>
          <div class="file-meta">Kích thước: ${(blob.size / 1024).toFixed(1)} KB</div>
        </div>
        <a href="${url}" download="${fileName}" class="btn-action">Tải về</a>
      `;
      fileList.appendChild(li);
    });

    resultArea.style.display = 'block';
  }

  downloadAllBtn.addEventListener('click', async () => {
    const zip = new JSZip();
    for (const [fileName, content] of Object.entries(mergedOutputs)) {
      zip.file(fileName, content);
    }
    const blob = await zip.generateAsync({ type: 'blob' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'merged_tex_files.zip';
    link.click();
  });
</script>
</body>
</html>
